;
;	ACME CSE configuration for gRPB-M2M development.
;	Copied into runtime/cse/ by scripts/run-cse.sh (ACME reads acme.ini from its base directory).
;	Everything not set here comes from acmecse/init/acme.ini.default.
;

[basic.config]
cseType=IN
cseID=id-in
cseName=cse-in
adminID=CAdmin
networkInterface=0.0.0.0
cseHost=${hostIPAddress}
httpPort=8080
logLevel=debug
databaseType=memory
consoleType=simple

[textui]
startWithTUI=false

[http]
enable=true

[mqtt]
enable=true
; The broker runs on the same machine as the CSE; Pis connect to that machine's LAN IP.
address=127.0.0.1
port=1883

[cse.security]
; Demo only: lets the fan controller and the HTTP dashboard read sensor data without ACP setup.
enableACPChecks=false
