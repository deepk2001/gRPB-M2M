# Development broker for gRPB-M2M. Open on the LAN so Raspberry Pis can connect.
# Anonymous access is for the hackathon demo only; add a password_file before any real deployment.
listener 1883 0.0.0.0
# MQTT 5 topic aliases per client (default 10): a server talking to many devices needs more.
max_topic_alias 1000
allow_anonymous true
protocol mqtt

persistence false
log_type error
log_type warning
log_type notice
log_dest stdout
